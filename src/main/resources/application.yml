spring:
  application:
    name: kalibra-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kalibra_db}
    username: ${DB_USER:quedena}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: ${MATERIALS_MAX_FILE_SIZE:20MB}
      max-request-size: ${MATERIALS_MAX_FILE_SIZE:20MB}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
    open-in-view: false

  flyway:
    enabled: false   # each module runs its own Flyway instance with its own history table (see shared/config/FlywayConfig)

server:
  port: ${SERVER_PORT:8080}

kalibra:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    cookie-secure: ${JWT_COOKIE_SECURE:true}   # false only for local http clients (Android emulator)
  seed:
    generic-users: ${KALIBRA_SEED_GENERIC_USERS:false}   # true only in local/demo: creates the generic test accounts
  storage:
    provider: ${STORAGE_PROVIDER:r2}   # r2 (Cloudflare R2, required for ingestion) | filesystem (local development only)
    materials-dir: ${MATERIALS_STORAGE_DIR:./storage/materials}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      url-validity: ${R2_URL_VALIDITY:PT15M}   # lifetime of the presigned URL handed to the adaptive engine
  engine:
    base-url: ${ENGINE_BASE_URL:http://localhost:8000}
    capabilities-ttl: ${ENGINE_CAPABILITIES_TTL:PT30S}
    request-timeout: ${ENGINE_REQUEST_TIMEOUT:PT5S}   # synchronous mastery estimation
    task-timeout: ${ENGINE_TASK_TIMEOUT:PT4M}         # long REST calls: extraction and generation
  progress:
    gap-map-cache-ttl: ${GAP_MAP_CACHE_TTL:PT10M}
  curriculum:
    ingestion-reconciliation-delay: ${INGESTION_RECONCILIATION_DELAY:PT5M}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}   # API docs and Swagger UI are off unless explicitly enabled
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

documentation:
  application:
    description: Kalibra API modular monolith
    version: '@project.version@'

management:
  endpoints:
    web:
      exposure:
        include: health   # only health — never expose env/beans/heapdump by default
  endpoint:
    health:
      show-details: never   # UP/DOWN only; no infra details to an unauthenticated caller
