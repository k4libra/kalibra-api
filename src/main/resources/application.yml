spring:
  application:
    name: kalibra-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kalibra_db}
    username: ${DB_USER:quedena}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: ${MATERIALS_MAX_FILE_SIZE:10MB}
      max-request-size: ${MATERIALS_MAX_FILE_SIZE:10MB}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
    open-in-view: false

  flyway:
    enabled: false   # each module runs its own Flyway instance with its own history table (see shared/config/FlywayConfig)

server:
  port: ${SERVER_PORT:8080}

kalibra:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  storage:
    materials-dir: ${MATERIALS_STORAGE_DIR:./storage/materials}   # provisional local adapter; the storage provider is still to be decided
  curriculum:
    ingestion-reconciliation-delay: ${INGESTION_RECONCILIATION_DELAY:PT5M}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

documentation:
  application:
    description: Kalibra API modular monolith
    version: '@project.version@'

management:
  endpoints:
    web:
      exposure:
        include: health   # only health — never expose env/beans/heapdump by default
  endpoint:
    health:
      show-details: never   # UP/DOWN only; no infra details to an unauthenticated caller
