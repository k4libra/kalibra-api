spring:
  application:
    name: kalibra-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kalibra_db}
    username: ${DB_USER:quedena}
    password: ${DB_PASSWORD}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
      timeout: 5s

  servlet:
    multipart:
      max-file-size: ${MATERIALS_MAX_FILE_SIZE:10MB}
      max-request-size: ${MATERIALS_MAX_FILE_SIZE:10MB}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
    open-in-view: false

  flyway:
    enabled: false   # each module runs its own Flyway instance with its own history table (see shared/config/FlywayConfig)

server:
  port: ${SERVER_PORT:8080}

kalibra:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  storage:
    provider: ${STORAGE_PROVIDER:r2}   # r2 (Cloudflare R2, required for ingestion) | filesystem (local development only)
    materials-dir: ${MATERIALS_STORAGE_DIR:./storage/materials}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      url-validity: ${R2_URL_VALIDITY:PT15M}   # lifetime of the presigned URL handed to the adaptive engine
  engine:
    base-url: ${ENGINE_BASE_URL:http://localhost:8000}
    request-timeout: ${ENGINE_REQUEST_TIMEOUT:PT5S}   # synchronous mastery estimation
    task-timeout: ${ENGINE_TASK_TIMEOUT:PT4M}         # queued extraction and generation
    tasks-stream: ${ENGINE_TASKS_STREAM:kalibra:engine:tasks}
    results-stream: ${ENGINE_RESULTS_STREAM:kalibra:engine:results}
    results-group: ${ENGINE_RESULTS_GROUP:kalibra-api}
  progress:
    gap-map-cache-ttl: ${GAP_MAP_CACHE_TTL:PT10M}
  curriculum:
    ingestion-reconciliation-delay: ${INGESTION_RECONCILIATION_DELAY:PT5M}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

documentation:
  application:
    description: Kalibra API modular monolith
    version: '@project.version@'

management:
  endpoints:
    web:
      exposure:
        include: health   # only health — never expose env/beans/heapdump by default
  endpoint:
    health:
      show-details: never   # UP/DOWN only; no infra details to an unauthenticated caller
  health:
    redis:
      enabled: false   # Redis backs the engine queue and a cache; the API itself stays up without it
